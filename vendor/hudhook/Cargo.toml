# Vendored hudhook 0.9.3 (https://github.com/veeenu/hudhook, see LICENSE) with one local
# change: the DX12 pixel shader can convert colours for an HDR swap chain, see src/color.rs and
# vendor/README.md. Wired in by [patch.crates-io] in the workspace Cargo.toml.
#

[package]
edition = "2021"
rust-version = "1.85"
name = "hudhook"
version = "0.9.3"
authors = ["Andrea Venuta <venutawebdesign@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autobenches = false
description = "A graphics API hook with dear imgui render loop. Supports DirectX 9, 11, 12, and OpenGL 3."
homepage = "https://github.com/veeenu/hudhook"
documentation = "https://veeenu.github.io/hudhook"
license-file = "LICENSE"
repository = "https://github.com/veeenu/hudhook"

[features]
default = [
    "dx9",
    "dx11",
    "dx12",
    "opengl3",
    "inject",
]
dx11 = []
dx12 = []
dx9 = []
imgui-docking = ["imgui/docking"]
imgui-freetype = ["imgui/freetype"]
imgui-tables-api = ["imgui/tables-api"]
inject = []
opengl3 = ["dep:gl_generator"]

[lib]
name = "hudhook"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.5.0"

[dependencies.imgui]
version = "0.12"

[dependencies.once_cell]
version = "1.18.0"
default-features = false

[dependencies.parking_lot]
version = "0.12"

[dependencies.tracing]
version = "0.1"
features = ["log"]
default-features = false

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
default-features = false

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
]

[dependencies.windows-numerics]
version = "0.3"

[build-dependencies.cc]
version = "1.0.72"

[build-dependencies.gl_generator]
version = "0.14.0"
optional = true

