[General]
# File format version, managed by the mod - don't change.
ConfigVersion = 1


[Debug]
# Logs the player's death animations while dead, for diagnosing. The mod has no reload key, so a
# change applies the next time the game starts.
DeathProbe = false


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
