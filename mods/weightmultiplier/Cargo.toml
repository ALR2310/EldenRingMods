[package]
name = "weightmultiplier"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "WeightMultiplier"
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../../shared" }
serde.workspace = true

[dev-dependencies]
toml.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# Files packed with the DLL in the release zip (scripts/build-mod.ps1 reads this).
[package.metadata.archive]
files = ["WeightMultiplier.toml"]

# Windows version resource (DLL properties), see build.rs
[package.metadata.winresource]
ProductName = "Weight Multiplier"
FileDescription = "Elden Ring mod"
InternalName = "WeightMultiplier"
OriginalFilename = "WeightMultiplier.dll"
LegalCopyright = "Copyright (c) 2026 ALR2310"
