[General]
# File format version, managed by the mod - don't change.
ConfigVersion = 1

# Key that reloads this file in game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show a banner at the top of the screen after a reload. Errors always show.
ReloadBanner = false


[Drop]
# Pick one way to adjust enemy drop chances.
# 0 = multiply an item's drop chance: a 1% item with x3 becomes 3%.
# 1 = set an item's drop chance to a fixed value: a 1% item set to 50 becomes 50%, and a 100% item
#     set to 50 also becomes 50%.
Mode = 0

# Drop-rate multiplier, used when Mode is 0. 1 is vanilla.
Multiplier = 3.0

# Fixed drop chance in percent, used when Mode is 1. 100 guarantees a drop.
Percentage = 30.0


[Materials]
# Multiplies how many materials you get. 1 is vanilla.

# Crafting materials you can farm, such as Rowa Fruit, Herba, butterflies, bones and mushrooms.
Crafting = 2.0

# Upgrade materials you can farm, such as Smithing Stones and Gloveworts.
Upgrade = 2.0

# Any material that can only be picked up once, such as Smithing Stones on corpses, Sacred Tears
# and Scadutree Fragments.
Unique = 1.0


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
