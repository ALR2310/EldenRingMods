[General]
# File format version, managed by the mod - don't change.
ConfigVersion = 1

# Key that reloads this file in game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show a banner at the top of the screen after a reload. Errors always show.
ReloadBanner = false


[ScarletRot]
# Damage-over-time duration in seconds, -1 for infinite. Vanilla: 90.
Duration = -1.0

# Percent of max HP dealt per tick. Vanilla: 0.18 (0.33 for some incantations and items).
PercentDamage = 0.18

# Flat damage per tick, added on top. Vanilla: 15.
FixedDamage = 15


[Poison]
# The same settings as Scarlet Rot, for Poison. Vanilla: 90 / 0.07 / 7.
Duration = -1.0
PercentDamage = 0.07
FixedDamage = 7


[BlackFlame]
# The same settings as Scarlet Rot, for the Black Flame burn.
# Vanilla: 2 / 0.1 / 1 (this mod's default duration is 10 seconds).
Duration = 10.0
PercentDamage = 0.1
FixedDamage = 1


[DestinedDeath]
# The burn works like Black Flame's. Vanilla: 2 / 0.1 / 1 (default duration 10 seconds).
Duration = 10.0
PercentDamage = 0.1
FixedDamage = 1

# How long the max HP loss lasts in seconds, -1 for infinite. Vanilla: 15 / 45.
MaxHpDuration = -1.0


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
