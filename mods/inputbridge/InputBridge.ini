[Input]
; Keep feeding the game keyboard input while its window is in the background
; (the game normally drops its keyboard device when it loses focus).
BackgroundKeyboard=true

; Make the game believe its window is in front while it is not, and keep it
; from grabbing the mouse cursor in that case.
SpoofForeground=true

; While the game window is not in front, ignore the real keyboard, mouse and
; gamepad, so only the agent's keys reach the game.
IsolateInput=true


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
