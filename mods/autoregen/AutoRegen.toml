[General]
# File format version, managed by the mod - don't change.
ConfigVersion = 1

# Key that reloads this file in game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show a banner at the top of the screen after a reload. Errors always show.
ReloadBanner = false


[PerTick]
# Restores HP, FP and Stamina over time.
Enabled = true

# When a tick may restore anything.
# 0 = always
# 1 = only while out of combat
# 2 = only while in combat
# 3 = only while idle (no movement, attack, item, guard or mount for 5+ seconds)
# 4 = only during one of the gestures listed in GestureId
Trigger = 0

# The gestures that count for Trigger 4: not just sitting, any gesture listed works. The default
# list is Dejection, Patches' Crouch, Crossed Legs, Rest, Sitting Sideways, Dozing Cross-Legged,
# Spread Out, Balled Up, Prayer and Desperate Prayer. A value is half of the game's gesture id.
GestureId = [80, 90, 91, 92, 93, 94, 95, 97, 100, 101]

# How often a tick happens, in milliseconds (1000 = every second).
Interval = 1000

# What the amounts below mean.
# 0 = points: HP = 1 restores 1 HP per tick.
# 1 = percent of the maximum: HP = 1 restores 1% of max HP per tick.
# 2 = percent of what is missing (max - current): HP = 5 restores 5% of the missing HP per tick,
#     fast while low and slower as it fills.
ValueType = 1

# Amount restored per tick.
HP = 0.5
FP = 1.0
SP = 5.0

# Highest percent of the maximum a tick restores a stat to. 100 means no ceiling; 80 stops
# restoring once the stat is at 80%.
Cap = 100.0


[PerHit]
# Restores HP, FP and Stamina when you land a hit.
Enabled = false

# 0 = a fixed number of points per hit.
# 1 = a percent of the maximum per hit.
# 2 = a percent of the damage you just dealt.
# Balanced starting points:
#   0: HP = 15, FP = 5, SP = 5.
#   1: with about 1500 max HP and 130 max FP/SP, HP = 1 (~15 HP), FP = 4 (~5 FP), SP = 4 (~5 SP).
#   2: with about 200 damage per hit, HP = 7.5 (~15 HP), FP = 2.5 (~5 FP), SP = 2.5 (~5 SP).
Mode = 0

# Which hits count.
# 0 = melee weapon hits only
# 1 = ranged and spell hits only
# 2 = both
DamageType = 0

# Hits of weapon arts (Ash of War) restore nothing.
ExcludeAow = false

# Amount restored per hit.
HP = 0.5
FP = 1.0
SP = 5.0


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
