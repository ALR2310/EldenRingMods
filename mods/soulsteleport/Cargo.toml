[package]
name = "soulsteleport"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "SoulsTeleport"
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../../shared", features = ["overlay"] }
eldenring.workspace = true
fromsoftware-shared.workspace = true
serde.workspace = true

[dev-dependencies]
toml.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
