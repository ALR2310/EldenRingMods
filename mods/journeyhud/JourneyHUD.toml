[General]
# file format version, managed by the mod - don't change
ConfigVersion = 1

# Key that reloads this file in-game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show a banner after a reload. Errors always show.
ReloadBanner = false

# Delay in milliseconds before the overlay hooks the game's graphics
LoadDelay = 5000

# Key that hides and shows the minimap and the target panel (empty = no key).
ToggleKey = "F6"


[Layout]
# Position of the minimap and target bar, from the top-right corner of the
# screen, in pixels at 1080p.
OffsetX = 48            # distance from the right edge; negative moves right
OffsetY = 47            # distance from the top edge


[Target]
# The locked-on enemy's health and posture bars.
Enabled = true
Width = 250             # Bar length in pixels (100 - 1600).
Scale = 1.0             # Panel size multiplier (0.5 - 3.0).
Buildup = true          # Status buildup bars (poison, rot, bleed...).
Effects = true          # The enemy's effects with the time left, as icons under its bars.
Numbers = true          # Show health, posture and buildup numbers.


[Player]
# Your own status icons and buildup bars at the top-left.
Scale = 0.7             # Size of the buildup gauge, 1 = the game's own (0.5 - 3.0).
Effects = true          # Time left under each of the game's status icons.
Buildup = true          # Move your buildup gauge to the top-left, under the status icons.


[Minimap]
# Round minimap: other players, your spirits, the locked-on enemy.
Enabled = true
Size = 125              # radius in pixels at 1080p (40 - 200)
Scale = 1.0             # size multiplier (0.5 - 3.0)
Range = 100             # meters from center to rim (20 - 200)
Rotate = false          # turn with the camera; false keeps north at the top
Compass = true          # N, E, S, W letters on the rim
Trail = false           # the path you have walked
Clock = true            # the in-game time under the minimap
Deaths = true           # your death count, above the minimap
FullMap = true          # false shows only what your map fragments reveal
ZoomInKey = ["0xBB", "0x6B"]   # zoom in (shorter range)
ZoomOutKey = ["0xBD", "0x6D"]  # zoom out (longer range)


[Minimap.Layers]
Map = true              # the game's world map, read from its own files
Graces = true           # sites of grace you have found
Points = true           # ruins, churches, caves, bosses...
Beacons = true          # beacons you placed on the world map
MapForGoblins = true    # markers of the Map for Goblins DLL, when it is loaded
CoopPlayers = true      # co-op partners (Seamless Co-op included)
Spirits = true          # your summoned spirits


[Minimap.Hide]
InCaves = false         # caves, catacombs and dungeons
InBossFights = false    # while a boss health bar is on screen


[Rendering]
# Enable HDR mode, and set the brightness and gamma.
HDRMode = "Auto"        # "Auto", "SDR", "HDR10" or "scRGB"
HDRBrightness = 1.0     # overall brightness, 1.0 = HDR reference white (0.1 - 4.0)
HDRGamma = 1.0          # above 1.0 darkens dim colours, below 1.0 lifts them (0.5 - 2.0)


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
