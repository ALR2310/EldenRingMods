[Target]
; Show the locked-on enemy's health and poise.
Enabled=true

; Panel offset from the top-right corner of the game's 16:9 picture (inside
; the black bars on other aspect ratios), in pixels at 1080p. Scales with the
; game resolution.
OffsetX=48
OffsetY=47

; Bar length in pixels at 1080p (100 - 1600). The thickness is fixed to match
; the player's own health bar.
Width=220

; Panel size multiplier (0.5 - 3.0).
Scale=1.0

; Show the health numbers above the bar (the game's own bars have none).
ShowNumbers=false


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
