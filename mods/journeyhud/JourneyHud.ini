[Target]
; Show the locked-on enemy's health and poise.
Enabled=true

; Offset of the right-hand column (the minimap, with the target bar under it)
; from the top-right corner of the game's 16:9 picture (inside the black bars
; on other aspect ratios), in pixels at 1080p. Scales with the game resolution.
OffsetX=48
OffsetY=47

; Bar length in pixels at 1080p (100 - 1600). The thickness is fixed to match
; the player's own health bar.
Width=220

; Panel size multiplier (0.5 - 3.0).
Scale=1.0

; Show the health numbers above the bar (the game's own bars have none).
ShowNumbers=false


[Minimap]
; Show a round minimap with the other players, your spirits and the enemy you are
; locked on to, turning with the camera.
MinimapEnabled=true

; Draw the game's world map under the minimap. The map is read from the game's
; own files, nothing of it is shipped with the mod.
MinimapMap=true

; Mark the sites of grace you have found on the minimap.
MinimapGraces=true

; Mark the ruins, churches, caves, bosses and other places of the world map on
; the minimap, with the game's own icons.
MinimapPoints=true

; Mark the beacons you have placed on the world map on the minimap.
MinimapBeacons=true

; Meters from the center of the minimap to its rim (20 - 200).
MinimapRange=80

; Radius of the minimap in pixels at 1080p (40 - 200). The default makes its
; diameter equal to the default target bar length.
MinimapSize=110


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
