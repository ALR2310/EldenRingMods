[package]
name = "journeyhud"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "JourneyHUD"
crate-type = ["cdylib"]

[dependencies]
aes = "0.8"
common = { path = "../../shared" }
eldenring.workspace = true
flate2 = "1"
fromsoftware-shared.workspace = true
# DX12 overlay + Dear ImGui (same stack as SoulsTeleport); only the DX12 backend.
hudhook = { version = "0.9.3", default-features = false, features = ["dx12"] }
libloading = "0.8"
png = "0.17"
rsa = { version = "0.9", features = ["pem"] }
serde.workspace = true
texture2ddecoder = "0.1"
toml.workspace = true

[build-dependencies]
winresource = "0.1"

# Windows version resource (DLL Properties), see build.rs
[package.metadata.winresource]
ProductName = "Journey HUD"
FileDescription = "Journey HUD - Elden Ring mod"
InternalName = "JourneyHUD"
OriginalFilename = "JourneyHUD.dll"
LegalCopyright = "Copyright (c) 2026 ALR2310"
