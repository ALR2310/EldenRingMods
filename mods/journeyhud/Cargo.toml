[package]
name = "journeyhud"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "JourneyHUD"
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../../shared", features = ["overlay"] }
aes = "0.8"
eldenring.workspace = true
flate2 = "1"
fromsoftware-shared.workspace = true
hudhook = { version = "0.9.3", default-features = false, features = ["dx12"] }
libloading = "0.8"
png = "0.17"
rsa = { version = "0.9", features = ["pem"] }
serde.workspace = true
texture2ddecoder = "0.1"
toml.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# Files packed with the DLL in the release zip (scripts/build-mod.ps1 reads this).
[package.metadata.archive]
files = ["JourneyHUD.toml", "THIRD-PARTY-NOTICES.txt"]

# Windows version resource (DLL properties), see build.rs
[package.metadata.winresource]
ProductName = "Journey HUD"
FileDescription = "Elden Ring mod"
InternalName = "JourneyHUD"
OriginalFilename = "JourneyHUD.dll"
LegalCopyright = "Copyright (c) 2026 ALR2310"
