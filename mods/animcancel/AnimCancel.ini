[Probe]
; Log the player's cancel windows to the log file: every time the animation or
; the allowed-action masks change, one line with the animation, how far into it
; we are, and the masks (see docs/animation_cancel.md).
LogCancelWindows=true

; Also log every change of the animation-event flags (CSChrActionFlagModule),
; to find which one the game waits for before it lets a cancel through.
LogFlagChanges=true


[Force]
; Research switch: while on, the actions below are always allowed to cancel the
; current animation (the game normally opens that window only for a few frames
; of each animation).
; Key that turns it on and off in game (F1-F24, a letter, or a hex key code).
Key=F7

; Start with it already on.
StartEnabled=false

; Actions to allow, separated by commas:
;   Guard, Dodge (roll + backstep), Weapon (switch weapon), Item, Attack, Jump
Actions=Guard,Dodge,Weapon

; Where in the frame to write it, separated by commas: PreBehavior,
; PreBehaviorSafe, BehaviorSafe, PrePhysics, PostPhysics. The game runs the
; animation (and its cancel logic) between PreBehaviorSafe and BehaviorSafe,
; so writing at PreBehaviorSafe is what the game sees this frame; BehaviorSafe
; is what it sees the next.
Stage=PreBehaviorSafe,BehaviorSafe

; Cancel flags the animation's events normally set for a few frames, also
; forced on: General, SlotSwitch, Attack, Movement. Leave empty for none.
TaeFlags=General,SlotSwitch,Attack

; Also clear the game's "no cancels" flag every frame.
ClearCancelDisable=true


[Logging]
; Write AnimCancel.log next to the DLL (the probe needs it: its results are in the log).
LogFile=true
