[General]
# file format version, managed by the mod - don't change
ConfigVersion = 2

# Key that reloads this config file in-game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show banner at the top of the screen after a reload.
# Errors always show.
ReloadBanner = false


[Guard]
# Raising the guard cancels the animations below (not while dual wielding or with twin blades).
Enabled = true
Attack = true       # normal attacks
Skill = true        # weapon arts (Ashes of War)
Cast = true         # casting sorceries and incantations
Item = true         # using items (flasks...)


[Dodge]
# Rolling and backstepping cancel the animations below.
Enabled = true
Attack = true
Skill = true
Cast = true
Item = true


[WeaponSwap]
# Switching weapons cancels the animations below.
Enabled = true
Attack = true
Skill = true
Cast = true
Item = true


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true

# Log the cancel windows of the animation you are playing.
CancelProbe = false

# Log every change of the animation-event flags.
FlagProbe = false
