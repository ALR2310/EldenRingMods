[General]
# File format version, managed by the mod - don't change.
ConfigVersion = 1

# Key that reloads this config file in-game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show a banner at the top of the screen after a reload.
ReloadBanner = false


[Bow]
# Base damage (physical/magic/fire/thunder/dark), per weapon type.
# Bow/Greatbow
DamageMultiplier = 1.5

# Bow/Greatbow only.
ScalingMultiplier = 2.0
UnlockAOW = true
WeightMultiplier = 0.5
SellValueMultiplier = 2.0


[Crossbow]
# Crossbow (weaponCategory=11, wepType=55)
DamageMultiplier = 3.0
WeightMultiplier = 0.5
SellValueMultiplier = 2.0


[Ballista]
# Ballista (weaponCategory=11, wepType=56)
DamageMultiplier = 4.0
WeightMultiplier = 0.5
SellValueMultiplier = 2.0


[Bullet]
ArrowMaxQuantity = 255
BoltMaxQuantity = 255
SpeedMultiplier = 3.5
RangeMultiplier = 2.0
SpreadMultiplier = 2.0
RainOfArrowsCount = 6


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
