[General]
# File format version, managed by the mod - don't change.
ConfigVersion = 1

# Key that reloads this file in game, no restart needed.
# https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
ReloadKey = "F5"

# Show a banner at the top of the screen after a reload. Errors always show.
ReloadBanner = false


[Bow]
# Bow and Greatbow. Multipliers apply to the game's own values; 1.0 is vanilla.

# Base damage (physical, magic, fire, thunder, dark).
DamageMultiplier = 1.5

# Stat scaling.
ScalingMultiplier = 2.0

# Every bow accepts an Ash of War; some vanilla bows ship without that.
UnlockAOW = true

WeightMultiplier = 0.5
SellValueMultiplier = 2.0


[Crossbow]
DamageMultiplier = 3.0
WeightMultiplier = 0.5
SellValueMultiplier = 2.0


[Ballista]
DamageMultiplier = 4.0
WeightMultiplier = 0.5
SellValueMultiplier = 2.0


[Bullet]
# How many arrows and bolts you can carry, from 0 to 255.
ArrowMaxQuantity = 255
BoltMaxQuantity = 255

# Flight speed of arrows and bolts.
SpeedMultiplier = 3.5

# Rain of Arrows: how far it reaches before its damage falls off, how wide its cone is and how many
# arrows it fires (an absolute count; vanilla is 1).
RangeMultiplier = 2.0
SpreadMultiplier = 2.0
RainOfArrowsCount = 6


[Logging]
# Write a log file next to the DLL, for troubleshooting.
LogFile = true
