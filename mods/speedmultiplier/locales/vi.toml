# Vietnamese text of the in-game menu (ERNativeUI). Each key is the English text
# used in src/menu.rs; the value is shown when the host language is
# "vietnamese" (ERNativeUI.ini: Language = vietnamese). Missing keys show
# English. A test checks that this file and menu.rs use the same texts.

"Settings for the Speed Multiplier mod." = "Thiết lập cho mod Speed Multiplier."

"All Player Actions" = "Mọi hành động của người chơi"
"Speed of everything you do. Anything but 1 overrides the individual player speeds." = "Tốc độ của mọi việc bạn làm. Khác 1 thì ghi đè các tốc độ riêng của người chơi."

"Player Movement" = "Di chuyển"
"How fast you move." = "Tốc độ di chuyển của bạn."
"Walk" = "Đi bộ"
"Walking speed." = "Tốc độ đi bộ."
"Run" = "Chạy"
"Running speed." = "Tốc độ chạy."
"Sneak" = "Đi rón rén"
"Sneaking speed." = "Tốc độ đi rón rén."
"Jump" = "Nhảy"
"Jumping and landing speed." = "Tốc độ nhảy và tiếp đất."
"Roll" = "Lăn"
"Rolling and backstepping speed." = "Tốc độ lăn và lùi bước."
"Ladder" = "Thang"
"Climbing and sliding speed." = "Tốc độ leo và trượt thang."

"Player Actions" = "Hành động"
"How fast you attack, cast and use items." = "Tốc độ tấn công, niệm phép và dùng vật phẩm."
