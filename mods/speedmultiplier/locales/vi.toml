"Other" = "Khác"
"Speed of any action not listed here." = "Tốc độ của mọi hành động không có trong danh sách."

"Torrent" = "Torrent"
"How fast Torrent moves." = "Tốc độ của Torrent."
"All" = "Tất cả"
"Speed of everything Torrent does. Anything but 1 overrides the rows below." = "Tốc độ của mọi hành động của Torrent. Khác 1 thì ghi đè các hàng bên dưới."
"Torrent's walking speed." = "Tốc độ đi bộ của Torrent."
"Torrent's running speed." = "Tốc độ chạy của Torrent."
"Torrent's jumping and landing speed." = "Tốc độ nhảy và tiếp đất của Torrent."
"Speed of any other Torrent action." = "Tốc độ của các hành động khác của Torrent."

"Spirit & Enemy" = "Linh hồn & Kẻ địch"
"How fast summoned spirits and enemies act." = "Tốc độ hành động của linh hồn được triệu hồi và kẻ địch."
"Spirit" = "Linh hồn"
"Speed of summoned spirit ashes." = "Tốc độ của tro linh hồn được triệu hồi."
"Enemy" = "Kẻ địch"
