[Menu]
; Key that opens and closes the in-game Toolbox GUI (F1..F24, a letter/digit,
; or a virtual-key code like 0x77).
MenuKey=F8

; Extra multiplier on the menu's automatic resolution scale (0.5 - 3.0).
; Restart the game after changing.
MenuScale=1.0

; Saved menu position and size (1080p units); -1 = default. Updated
; automatically when you drag or resize the menu, or click Reset.
MenuX=-1
MenuY=-1
MenuWidth=-1
MenuHeight=-1


[Toolbox]
; Key that reloads this file in game (hotkeys and Buildup values; the two
; "Anywhere" patches below need a game restart).
ReloadKey=F5


[MapAnywhere]
; Open the map and fast travel from anywhere: mid-boss-fight and inside
; caves/dungeons. Code patch applied at startup, restart the game to undo.
MapAnywhere=true


[TorrentAnywhere]
; Summon and ride Torrent anywhere, including areas that force a dismount.
; Code patch applied at startup, restart the game to undo.
TorrentAnywhere=true


[Buildup]
; How much buildup each GUI click adds, in bar points.
; 0 = fill the whole bar (triggers the status at once).
BuildupAmount=0


[Logging]
; Write a log file next to the DLL, for troubleshooting.
LogFile=true
