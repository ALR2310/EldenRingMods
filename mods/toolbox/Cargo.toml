[package]
name = "toolbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "Toolbox"
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../../shared", features = ["overlay"] }
eldenring.workspace = true
fromsoftware-shared.workspace = true
serde.workspace = true

[dev-dependencies]
toml.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# Files packed with the DLL in the release zip (scripts/build-mod.ps1 reads this).
[package.metadata.archive]
files = ["Toolbox.toml"]

# Windows version resource (DLL properties), see build.rs
[package.metadata.winresource]
ProductName = "Toolbox"
FileDescription = "Elden Ring mod"
InternalName = "Toolbox"
OriginalFilename = "Toolbox.dll"
LegalCopyright = "Copyright (c) 2026 ALR2310"
