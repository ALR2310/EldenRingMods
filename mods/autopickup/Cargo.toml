[package]
name = "autopickup"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "AutoPickup"
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../../shared" }
eldenring.workspace = true
fromsoftware-shared.workspace = true
serde.workspace = true

[dev-dependencies]
toml.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# Files packed with the DLL in the release zip (scripts/build-mod.ps1 reads this).
[package.metadata.archive]
files = ["AutoPickup.toml"]

# Windows version resource (DLL properties), see build.rs
[package.metadata.winresource]
ProductName = "Auto Pickup"
FileDescription = "Auto Pickup - Elden Ring mod"
InternalName = "AutoPickup"
OriginalFilename = "AutoPickup.dll"
LegalCopyright = "Copyright (c) 2026 ALR2310"
