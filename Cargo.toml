[workspace]
resolver = "2"
members = ["shared", "mods/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["ALR2310"]
publish = false

[workspace.dependencies]
# Rust bindings for the game's engine structs: https://github.com/vswarte/fromsoftware-rs
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
vtable-rs = "0.1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
