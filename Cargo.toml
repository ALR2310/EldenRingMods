[workspace]
resolver = "2"
members = [
    "shared",
    "mods/autoregen",
    "mods/sometweaks",
    "mods/passiverunes",
    "mods/runemultiplier",
    "mods/weightmultiplier",
    "mods/risearcher",
    "mods/dropmultiplier",
    "mods/infiniteailment",
    "mods/soulsteleport",
    "mods/spiritmultiplier",
    "mods/fasterrevival",
    "mods/windowresize",
    "mods/speedmultiplier",
    "mods/animcancel",
    "mods/autopickup",
]

[workspace.dependencies]
# https://github.com/vswarte/fromsoftware-rs - Rust bindings to the game's engine
# structs. Same rev for both crates so every mod builds against one version.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "57023153d786c4b13fe95d9170e6dcd9d35093ea" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Fake C++ vtable for registering a Rust closure as a game task
vtable-rs = "0.1.5"
# TOML config (common::toml_config): typed parse via serde, comment-preserving
# "add missing keys from the template" via toml_edit.
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
# Menu translation files (common::i18n).
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
