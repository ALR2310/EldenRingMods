[workspace]
resolver = "2"
members = [
    "shared",
    "mods/autoregen",
    "mods/sometweaks",
    "mods/passiverunes",
    "mods/runemultiplier",
    "mods/weightmultiplier",
    "mods/risearcher",
    "mods/dropmultiplier",
    "mods/infiniteailment",
    "mods/soulsteleport",
    "mods/spiritmultiplier",
    "mods/fasterrevival",
    "mods/windowresize",
    "mods/speedmultiplier",
    "mods/animcancel",
]

[workspace.dependencies]
# https://github.com/vswarte/fromsoftware-rs - Rust bindings to the game's engine
# structs. Same rev for both crates so every mod builds against one version.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "6933967b176332a37e9ce6773f8dcd74b9feaf42" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "6933967b176332a37e9ce6773f8dcd74b9feaf42" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Fake C++ vtable for registering a Rust closure as a game task
vtable-rs = "0.1.5"
# TOML config (common::toml_config): typed parse via serde, comment-preserving
# "add missing keys from the template" via toml_edit.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[profile.release]
lto = true
codegen-units = 1
